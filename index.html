<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WalkWithMe">
<title>WalkWithMe — the subway, offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--water:#06080B;--landc:#11141A;--landst:#1C2129;--bg:#0A0C0F;--glass:rgba(20,23,29,.66);--card:#13161B;--ink:#F3EFE6;--muted:#8A8F99;--faint:#5A5F69;--line:rgba(255,255,255,.075);--accent:#E8D9B8;--aink:#16120A;--soft:rgba(255,255,255,.05);--mh:52vh;--r:22px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
body.big{font-size:19px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--mh) + 18px) 20px 130px}
h2{font-size:.72em;margin:30px 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.16em}
.muted{color:var(--muted)}
button,.btn{font:inherit;border:0;border-radius:16px;padding:15px 20px;cursor:pointer;font-weight:600;min-height:54px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:inherit;transition:transform .2s var(--ease),background .3s,opacity .3s}
button:active,.btn:active{transform:scale(.975)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.primary{background:var(--accent);color:var(--aink);box-shadow:0 10px 30px -10px rgba(232,217,184,.45)}
.ghost{background:var(--soft);border:1px solid var(--line)}
.full{width:100%}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:var(--r)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.bullet{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:.82em;flex:none;font-family:Helvetica,Arial,sans-serif;letter-spacing:0;vertical-align:-.4em;box-shadow:0 0 0 2px var(--bg),0 0 14px -2px var(--g)}
/* hero + search */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:#7EE2A8;box-shadow:0 0 10px #7EE2A8}
.eyebrow.off i{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.hero h1{font-size:3.1em;line-height:1;margin:10px 0 18px;font-weight:400}
.hero h1 em{color:var(--accent)}
.search{padding:6px;position:relative}
.field{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;min-height:58px}
.field+.field{border-top:1px solid var(--line);border-radius:0 0 16px 16px}
.field .k{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);width:38px;font-weight:600}
.field input{flex:1;background:transparent;border:0;color:var(--ink);font:inherit;font-size:1.06em;padding:4px 0;min-height:0;outline:0}
.field input::placeholder{color:var(--faint)}
.field .val{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.field .x{min-height:34px;padding:4px 10px;font-size:.8em;background:transparent;color:var(--muted)}
.swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:42px;height:42px;min-height:0;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--accent);z-index:2}
.picks{padding:0 6px 6px}
.picks button{width:100%;justify-content:flex-start;background:transparent;min-height:50px;padding:10px 12px;font-weight:500;border-radius:12px;animation:rise .35s var(--ease) both}
.picks button:hover{background:var(--soft)}
/* trips */
.trip{display:flex;align-items:center;gap:16px;width:100%;text-align:left;justify-content:flex-start;padding:18px;margin:10px 0;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s}
.trip:hover{transform:translateY(-2px);border-color:rgba(232,217,184,.35)}
.trip .lines{display:flex;flex-direction:column;gap:4px}
.trip .t{flex:1}.trip .t b{display:block;font-weight:600}
.trip .t small{color:var(--muted);font-weight:400}
.trip .m{text-align:right}.trip .m .serif{font-size:2em;line-height:1}.trip .m small{display:block;color:var(--muted);font-size:.72em;letter-spacing:.1em;text-transform:uppercase}
.linesrow{display:flex;flex-wrap:wrap;gap:10px}
.linesrow button{min-height:46px;width:46px;padding:0;border-radius:50%;font-family:Helvetica,Arial,sans-serif;font-weight:700;box-shadow:0 0 0 1px var(--line),0 8px 24px -10px var(--g)}
.linesrow .all{width:auto;padding:0 18px;border-radius:999px;background:var(--soft);font-family:inherit;font-weight:600}
/* trip view */
.back{background:transparent;padding:6px 0;min-height:40px;color:var(--muted)}
.title{font-size:2.5em;line-height:1.05;margin:6px 0 14px}
.stats{display:flex;gap:10px}
.stat{flex:1;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.stat small{display:block;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:4px}
.stat .serif{font-size:1.9em;line-height:1}
.step{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);animation:rise .5s var(--ease) both}
.step:last-child{border-bottom:0}
.num{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:600;flex:none;margin-top:1px}
.sign{display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;padding:6px 12px;border-radius:8px;font-weight:600;font-family:Helvetica,Arial,sans-serif;font-size:.92em;margin-top:8px;border:1px solid #222}
details summary{cursor:pointer;color:var(--accent);font-weight:500;margin-top:8px;font-size:.92em;list-style:none}
details ol{color:var(--muted)}
.live{display:flex;align-items:center;gap:14px}
.live .dot{width:10px;height:10px;border-radius:50%;background:#7EE2A8;box-shadow:0 0 0 0 rgba(126,226,168,.6);animation:ping 2s infinite}
.offnote{border-color:rgba(232,217,184,.25)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:6}
.bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}.bar .inner>*{flex:1}
.hidden{display:none!important}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle+.toggle{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--soft);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .3s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .35s var(--ease),background .3s}
.sw:checked{background:rgba(232,217,184,.25)}.sw:checked::after{transform:translateX(20px);background:var(--accent)}
input.txt{font:inherit;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:54px}
/* map */
#map{position:fixed;top:0;left:0;right:0;height:var(--mh);z-index:5;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0E1218,var(--water))}
#map::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
#svgmap{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.land{fill:var(--landc);stroke:var(--landst);stroke-width:1;vector-effect:non-scaling-stroke}
.boro text{fill:rgba(255,255,255,.16);font-weight:600;letter-spacing:.6em;font-family:Inter,sans-serif}
.ln{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:opacity .7s var(--ease),stroke-width .7s var(--ease);filter:drop-shadow(0 0 3px var(--g))}
.focus .ln{opacity:.09;filter:none}.focus .ln.hl{opacity:1;stroke-width:6;filter:drop-shadow(0 0 8px var(--g))}
.st{fill:var(--bg);stroke-width:1.6;vector-effect:non-scaling-stroke;transition:opacity .7s}
.st.xf{fill:#fff;stroke:var(--bg)!important}
.focus .st{opacity:.12}
.rline{fill:none;stroke-width:calc(var(--u)*7);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease) forwards;filter:drop-shadow(0 0 calc(var(--u)*10) var(--g))}
.rflow{fill:none;stroke:#fff;stroke-width:calc(var(--u)*2.2);stroke-linecap:round;stroke-dasharray:.002 .045;opacity:0;animation:flow 2.4s linear infinite,fadein .8s 1.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-.047}}
@keyframes fadein{to{opacity:.85}}
.rst{fill:var(--bg);stroke:#fff;stroke-width:calc(var(--u)*1.6);opacity:0;animation:fadein .5s 1.2s forwards}
.lab{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:calc(var(--u)*4);stroke-linejoin:round;font-family:Inter,sans-serif;opacity:0;animation:fadein .6s 1.3s forwards}
.pulse{fill:none;stroke:var(--accent);transform-box:fill-box;transform-origin:center;animation:pulse 2.2s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
#train{transition:transform .9s var(--ease)}
.mapchip{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;padding:9px 16px;border-radius:999px;z-index:2;font-size:1.15em}
.mapchip em{color:var(--accent)}
#net{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:2;padding:9px 14px;border-radius:999px;font-size:.7em}
.mapbtns{position:absolute;right:16px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mapbtns button{min-height:42px;width:42px;padding:0;border-radius:14px;font-size:1.05em;color:var(--ink)}
/* ride */
#ride{position:fixed;left:0;right:0;bottom:0;top:calc(var(--mh) - 24px);z-index:8;overflow:auto;border-radius:28px 28px 0 0;background:rgba(12,14,18,.82);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border-top:1px solid var(--line);animation:sheet .6s var(--ease)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
#ride .wrap{padding:12px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100%}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.rtop{display:flex;align-items:center;justify-content:space-between;font-size:.82em;color:var(--muted)}
.rtop button{min-height:36px;padding:6px 14px;font-size:.95em}
.progress{height:2px;border-radius:9px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .9s var(--ease)}
.rcore{display:flex;align-items:center;gap:22px;margin:18px 0 8px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease);filter:drop-shadow(0 0 8px var(--c))}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:4.2em;line-height:1}
.rlabel{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rnext{font-family:'Instrument Serif',serif;font-size:2em;line-height:1.08;margin:6px 0 4px;animation:rise .6s var(--ease) both}
.alertbox{border-radius:20px;padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,transparent),transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);margin:8px 0;animation:rise .5s var(--ease) both}
.arrive{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(232,217,184,.35),transparent 60%);animation:glow 1.8s var(--ease) forwards}
@keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.spacer{flex:1;min-height:12px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(126,226,168,.55)}100%{box-shadow:0 0 0 12px rgba(126,226,168,0)}}
main>*{animation:rise .6s var(--ease) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}main>*:nth-child(n+6){animation-delay:.25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.rline{stroke-dashoffset:0}.rflow,.rst,.lab{opacity:.85}}
.locdot{width:10px;height:10px;border-radius:50%;background:#6AA8FF;box-shadow:0 0 0 4px rgba(106,168,255,.2),0 0 12px #6AA8FF;animation:ping2 2s infinite}
@keyframes ping2{50%{box-shadow:0 0 0 8px rgba(106,168,255,.08),0 0 12px #6AA8FF}}
.tags{display:flex;gap:6px;margin-bottom:8px}.tg{font-size:.66em;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);border:1px solid rgba(232,217,184,.3);padding:3px 8px;border-radius:99px}
.olines{display:flex;align-items:center;gap:6px;margin-bottom:6px}.ar{color:var(--faint)}.wk{font-size:.85em;color:var(--muted)}
.opt{animation:rise .6s var(--ease) both}
.ln.intro{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:500;font-size:.9em;animation:rise .5s var(--ease) both}
.chip .bullet{font-size:.75em;margin-right:2px}
.eta{margin-top:4px;color:var(--accent)!important;letter-spacing:.04em!important;text-transform:none!important;font-size:.78em!important}
.upnext{display:flex;flex-direction:column;margin:6px 0 4px;padding-left:4px;border-left:1px dashed var(--line)}
.upnext span{display:flex;align-items:center;gap:12px;padding:6px 0 6px 10px;color:var(--muted);font-size:.95em;animation:rise .45s var(--ease) both;margin-left:-9px}
.upnext i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--bg)}
.upnext .exit{color:var(--ink);font-weight:600}
.arr{margin-top:14px}
.arrhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.arrhead .rlabel{display:flex;align-items:center;gap:8px}.arrhead .bullet{font-size:.95em}
.badge{font-size:.62em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.badge.live{color:#7EE2A8;background:rgba(126,226,168,.1)}.badge.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#7EE2A8;animation:ping 2s infinite}
.badge.saved{color:var(--accent);background:rgba(232,217,184,.1)}.badge.off{color:var(--muted);background:var(--soft)}
.arrrow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;animation:rise .5s var(--ease) both}
.arrrow .big{font-size:2.8em;line-height:1}.then{margin-left:auto;color:var(--muted)}
.small{font-size:.82em;margin-top:6px}
.shim{height:52px;border-radius:12px;background:linear-gradient(90deg,var(--soft),rgba(255,255,255,.1),var(--soft));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.linkout{display:block;text-align:right;color:var(--muted);font-size:.85em;text-decoration:none;margin:-4px 4px 0}
.locname{font-weight:400;font-size:.85em}
.ln{transition:opacity .7s var(--ease),stroke-width .7s var(--ease),stroke 1.2s var(--ease)}
.calm .ln{stroke:#2B3039;filter:none}
.calm .st{stroke:#3A3F49}.calm .st.xf{fill:#9AA0AA}
.focus .ln{opacity:.55}.calm.focus .ln{opacity:.6}
.focus .ln.hl{stroke:var(--g)!important}
.rline{animation:draw 1.6s var(--ease) forwards,glowp 1.8s 1.6s ease-in-out infinite}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 calc(var(--u)*6) var(--g))}50%{filter:drop-shadow(0 0 calc(var(--u)*18) var(--g)) brightness(1.25)}}
.spark path{transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle 2.4s var(--d) ease-in-out infinite;filter:drop-shadow(0 0 3px #fff)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9}}
.seg{position:relative;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;min-height:44px;background:transparent;position:relative;z-index:1;color:var(--muted);font-size:.92em;padding:8px}
.seg button.on{color:var(--ink)}
.segpill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px -8px rgba(0,0,0,.6);transition:transform .45s var(--ease)}
.hero-opt{padding:22px;border-color:rgba(232,217,184,.3);background:linear-gradient(160deg,rgba(232,217,184,.07),var(--card) 60%)}
.hero-opt .m .serif{font-size:2.6em}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 12px 30px -14px rgba(232,217,184,.4)}
@media (prefers-reduced-motion:reduce){.spark{display:none}}
.goldmode .rst{stroke:#E8C77A}
.goldmode .rline{animation:draw 1.6s var(--ease) forwards,glowp 2.2s 1.6s ease-in-out infinite}
.lab.mid{font-weight:500;fill:#C9C3B4;opacity:0;animation:fadein .6s 1.6s forwards}
.goldmode .lab:not(.mid){fill:#F3DFA6}
.tlwrap{position:relative}
.tl{position:relative;display:flex;gap:16px;padding:0 0 18px 0;min-height:44px}
.tl .rail{position:absolute;left:10px;top:12px;bottom:-12px;width:4px;border-radius:4px;background:linear-gradient(#F6DC94,#D4A84B);box-shadow:0 0 12px rgba(232,199,122,.35)}
.tl.end .rail{display:none}
.tl .dot{position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:4px solid #E8C77A;margin-top:0;box-shadow:0 0 14px rgba(232,199,122,.45)}
.tl.key .dot{width:24px;height:24px;background:#E8C77A;border-color:var(--bg);box-shadow:0 0 0 3px #E8C77A,0 0 18px rgba(232,199,122,.6)}
.tl.end .dot{animation:ping3 2s infinite}
@keyframes ping3{50%{box-shadow:0 0 0 3px #E8C77A,0 0 0 10px rgba(232,199,122,.15),0 0 22px rgba(232,199,122,.7)}}
.tl.ride .dot,.tl.mini .dot{width:12px;height:12px;margin:6px 6px 0;border-width:3px}
.tl.walk .rail{background:repeating-linear-gradient(#8A8F99 0 6px,transparent 6px 12px);box-shadow:none}
.tl.walk .dot{border-color:#6AA8FF;box-shadow:0 0 12px rgba(106,168,255,.5)}
.tl.mini{min-height:30px;padding-bottom:8px}.tl.mini b{font-weight:400;color:var(--muted);font-size:.92em}
.tlt b{font-size:1.06em}.tl.key .tlt b{font-size:1.2em}
.tls{color:var(--muted);font-size:.9em;margin-top:4px;line-height:1.7}
.sign.mini{margin-top:0;padding:2px 8px;font-size:.82em}
.tlmid summary{list-style:none;margin:0;color:inherit}.tlmid summary::-webkit-details-marker{display:none}
.tlmid summary .tls{color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(var(--mh) - 70px);transform:translateX(-50%);z-index:40;padding:12px 18px;border-radius:999px;font-weight:600;font-size:.9em;animation:toast 3.2s var(--ease) forwards;white-space:nowrap}

/* ===== Arrivals: live when online, last saved when offline =====
   Swap DEMO for the MTA GTFS-realtime feed (via a small proxy) once hosted outside Claude. */
const LIVE_SOURCE='demo';
async function fetchArrivals(st,line,dir){
  if(!isOn())throw new Error('offline');
  if(LIVE_SOURCE==='demo'){await new Promise(r=>setTimeout(r,650));
    const now=Date.now(),h=new Date().getHours(),hw=(h>=6&&h<10)||(h>=16&&h<20)?5:h<6?16:8;
    const seed=(st+line+dir).split('').reduce((x,c)=>x+c.charCodeAt(0),0),first=((seed+Math.floor(now/60000))%hw)+1;
    return [first,first+hw,first+2*hw].map(m=>now+m*60000-((now/1000)%60)*1000)}
  // e.g. const r=await fetch(`${LIVE_SOURCE}?stop=${st}&line=${line}&dir=${dir}`);return (await r.json()).arrivals;
}
const tfmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

function liveBox(st,line,dir){return `<div class="card arr" data-st="${st}" data-line="${line}" data-dir="${dir}" id="arrBox"><div class="arrhead"><span class="rlabel">Next ${bullet(line)} trains · ${esc(S[st])}</span><span class="badge" id="arrBadge"></span></div><div id="arrBody" class="arrbody"><div class="shim"></div></div></div>`}
function paintArr(saved,state){
  const body=$('#arrBody'),badge=$('#arrBadge');if(!body)return;const line=$('#arrBox').dataset.line;
  const now=Date.now(),up=saved?saved.arr.filter(t=>t>now-30000):[];
  const mins=up.map(t=>Math.max(0,Math.round((t-now)/60000)));
  const main=m=>m===0?'<span class="serif big">Now</span>':`<span class="serif big">${m}</span><span class="muted"> min</span>`;
  if(state==='live'&&up.length){badge.className='badge live';badge.textContent='Live';
    body.innerHTML=`<div class="arrrow">${main(mins[0])}<span class="then">${mins.slice(1).length?'then '+mins.slice(1).join(', ')+' min':''}</span></div><div class="muted small">Updated ${tfmt(saved.t)}${LIVE_SOURCE==='demo'?' · mock feed':''}</div>`}
  else if(up.length){badge.className='badge saved';badge.textContent='Saved';
    body.innerHTML=`<div class="arrrow">${main(mins[0]).replace('</span><span class="muted"> min','</span><span class="muted"> min (est.)')}<span class="then">${mins.slice(1).length?'then ~'+mins.slice(1).join(', ')+' min':''}</span></div><div class="muted small">No signal · based on your last check at ${tfmt(saved.t)}</div>`}
  else{badge.className='badge off';badge.textContent='Offline';
    body.innerHTML=`<div><b>Internet needed for arrival times</b></div><div class="muted small">${bullet(line)} trains usually run ${freq()}. Your route still works offline.</div>`}
}
async function refreshArr(){
  const box=$('#arrBox');if(!box){clearInterval(liveTimer);liveTimer=null;return}
  const{st,line,dir}=box.dataset,key=`cc_arr_${st}_${line}_${dir}`;let saved=store.get(key,null);
  if(!isOn()){paintArr(saved,'saved');return}
  try{const arr=await fetchArrivals(st,line,dir);saved={t:Date.now(),arr};store.set(key,saved);paintArr(saved,'live')}catch(e){paintArr(saved,'saved')}
}
function startArr(){clearInterval(liveTimer);refreshArr();liveTimer=setInterval(()=>{const box=$('#arrBox');if(!box)return refreshArr();
  const{st,line,dir}=box.dataset;const s=store.get(`cc_arr_${st}_${line}_${dir}`,null);

/* ===== Station picker ===== */
function picker(box,val,ph,onPick,key){
  const draw=()=>{
    if(val){box.innerHTML=`<div class="field"><span class="k">${key}</span><span class="val">${bullets(val)} ${esc(S[val])}</span><button class="x" aria-label="Change">Change</button></div>`;
      box.querySelector('.x').onclick=()=>{val=null;onPick(null);draw();box.querySelector('input').focus()};return}
    box.innerHTML=`<div class="field"><span class="k">${key}</span><input placeholder="${ph}" autocomplete="off" aria-label="${ph}"></div><div class="picks"></div>`;
    const q=box.querySelector('input'),list=box.querySelector('.picks');
    q.oninput=()=>{const v=q.value.toLowerCase().replace(/[^a-z0-9]/g,'');
      const hits=v?Object.keys(S).filter(s=>S[s].toLowerCase().replace(/[^a-z0-9]/g,'').includes(v)).sort((a,b)=>S[a].toLowerCase().replace(/[^a-z0-9]/g,'').indexOf(v)-S[b].toLowerCase().replace(/[^a-z0-9]/g,'').indexOf(v)).slice(0,6):[];
      list.innerHTML=hits.map((s,i)=>`<button data-s="${s}" style="animation-delay:${i*30}ms">${bullets(s)} <span>${esc(S[s])}</span></button>`).join('');
      list.querySelectorAll('button').forEach(b=>b.onclick=()=>{val=b.dataset.s;onPick(val);draw()})};
  };draw();
}

   <span class="t">
     ${i===0?`<span class="bestpill">${{shortest:'Fastest',reliable:'Most reliable',scenic:'Most scenic'}[mode]}</span>`:''}
     <span class="olines">${o.r.segs.map(g=>bullet(g.line)).join('<span class="ar">→</span>')}</span>
     <small>From ${esc(S[o.from])} · ${xferNote(o.r)}</small>
</span>
   <span class="m"><span class="serif">${o.total}</span><small>min</small><small class="eta">${eta(o.total)}</small></span></button>`}
let tripMode='shortest';
function showOptions(get,to,loc){
  let opts=get(tripMode),sel=-1;
  if(!opts.length){$('#view').innerHTML=`<button class="back" id="bk">← Back</button><div class="card">No route found in this prototype.</div>`;$('#bk').onclick=home;return}
  const pick=i=>{const o=opts[i];trips=trips.filter(t=>t.id!=='quick');trips.push({id:'quick',name:`To ${S[to]}`,from:o.from,to,walk:o.walk,note:'',opt:o});showTrip('quick')};
  const bar=()=>{const i=sel<0?0:sel;setBar(`<button class="primary" id="goSel">${sel<0?'Take the '+{shortest:'fastest',reliable:'most reliable',scenic:'most scenic'}[tripMode]+' route':'Go'} · ${opts[i].total} min</button>`);$('#goSel').onclick=()=>pick(i)};
  const draw=()=>{
    $('#view').innerHTML=`<button class="back" id="bk">←</button>
     <h1 class="serif title">To <em style="color:var(--accent)">${esc(S[to])}</em></h1>
     <div class="modes">${[['shortest','Shortest'],['reliable','Reliable'],['scenic','Scenic']].map(([k,l])=>`<button data-mode="${k}" class="${tripMode===k?'on':''}">${l}</button>`).join('')}</div>
     ${opts.map((o,i)=>optCard(o,i,i===sel,tripMode)).join('')}`;
    $('#bk').onclick=()=>{qTo=null;home()};
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{tripMode=b.dataset.mode;opts=get(tripMode);sel=-1;draw();bar();removeTrain();drawAll(opts,to)});
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===sel)return pick(i);sel=i;
      document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',+x.dataset.i===sel));removeTrain();drawRoute(opts[i].r,true);bar()});
  };
  draw();bar();removeTrain();drawAll(opts,to);scrollTo({top:0});
}

function timeline(r,t,walk){
  let rows=[];const row=(cls,name,sub,color)=>`<div class="tl ${cls}"><span class="rail"></span><span class="dot"></span><div class="tlt"><b>${name}</b>${sub?`<div class="tls">${sub}</div>`:''}</div></div>`;
  r.segs.forEach((g,i)=>{const d=LINES[g.line][g.dir];
    rows.push(row('key',esc(S[g.stops[0]]),`${i?'Change here · ':''}Take the ${bullet(g.line)} — follow <span class="sign mini">${esc(d.sign)}</span>`));
    const mids=g.stops.slice(1,-1);
    if(mids.length)rows.push(`<details class="tlmid"><summary>${row('ride',`${plural(mids.length,'stop')}`,'Stay on the train · tap to see them')}</summary>${mids.map(s=>row('mini',esc(S[s]),'')).join('')}</details>`);
    if(i===r.segs.length-1)rows.push(row('key end',esc(S[g.stops[g.n]]),`Get off here${t.note?' · '+esc(t.note):''}`));
  });
  return `<div class="tlwrap">${rows.join('')}</div>`;
}
const step=(n,html,d)=>`<div class="step" style="animation-delay:${d}ms"><span class="num">${n}</span><div>${html}</div></div>`;
function showTrip(id){
  const t=trips.find(x=>x.id===id);const r=t.opt?t.opt.r:route(t.from,t.to);const walk=t.walk||0;
  if(!r){$('#view').innerHTML=`<button class="back" onclick="home()">← Back</button><div class="card">No route in this prototype yet.</div>`;return}
  let n=0,steps='',d=0;const S2=s=>`<b>${esc(S[s])}</b>`;
  r.segs.forEach((g,i)=>{const L=LINES[g.line],dd=L[g.dir];
    if(i===0)steps+=step(++n,`Enter ${S2(g.stops[0])} and follow the sign<br><span class="sign">${bullet(g.line)} ${esc(dd.sign)}</span>`,d+=60);
    else steps+=step(++n,`${g.xferIn.kind==='walk'?`Stay inside. ${esc(g.xferIn.note)} You are now at ${S2(g.stops[0])}.`:'Stay inside the station and change trains.'}<br><span class="sign">${bullet(g.line)} ${esc(dd.sign)}</span>`,d+=60);
    steps+=step(++n,`Board the ${bullet(g.line)} — the front reads <b>${esc(dd.last)}</b>. Ride <b>${plural(g.n,'stop')}</b>.
      <details><summary>Show the ${plural(g.n,'stop')}</summary><ol style="margin:8px 0 0;padding-left:20px">${g.stops.slice(1).map(s=>`<li>${esc(S[s])}</li>`).join('')}</ol></details>`,d+=60);
    if(i===r.segs.length-1)steps+=step(++n,`Step off at ${S2(g.stops[g.n])}.${t.note?`<br><span class="muted">${esc(t.note)}</span>`:''}`,d+=60);
  });
  const on=isOn();
  $('#view').innerHTML=`
   <button class="back" id="bk">← Journeys</button>
   <h1 class="serif title">${esc(t.name)}</h1>
   <div class="stats">
     <div class="stat"><small>Duration</small><span class="serif">${r.mins+walk}</span> <span class="muted">min</span></div>
     <div class="stat"><small>${r.changes?plural(r.changes,'change'):'Direct'}</small>${r.segs.map(g=>bullet(g.line)).join(' ')}</div>
     <div class="stat"><small>Arrive</small><span class="serif">${eta(r.mins+walk).replace(/\s?[AP]M/i,'')}</span> <span class="muted">${(eta(r.mins+walk).match(/[AP]M/i)||[''])[0]}</span></div>
   </div>
   ${t.opt&&t.opt.blurb&&!specialFor(r).length?`<p class="tripblurb">${esc(t.opt.blurb)}</p>`:''}
   ${liveBox(r.segs[0].stops[0],r.segs[0].line,r.segs[0].dir)}
   ${on?`<a class="linkout" href="${gmaps(t.from,t.to)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`:''}
   <h2>Your stations</h2>
   <div class="card" style="padding:18px 18px 8px">${timeline(r,t,walk)}</div>
   ${(()=>{const sp=specialFor(r);if(!sp.length)return '';return `<h2>What's special</h2>`+sp.map(x=>`<div class="card special">
     <div class="sphead">${bullet(x.line)}<b>${esc(x.title)}</b><span class="spn">${plural(x.n,'stretch')} above ground</span></div>
     <p>${esc(x.text)}</p><p class="sptip">${esc(x.tip)}</p></div>`).join('')+`<p class="why">Why pick this route: you get daylight and a real view of the city for a few extra minutes, instead of a tunnel the whole way.</p>`})()}
   <h2>Good to know</h2>
   <div class="card tips">${tipsFor(r).map(x=>`<p><i></i><span>${x}</span></p>`).join('')}</div>

   ${id==='quick'?'':`<button class="textbtn" id="del" style="margin:10px auto 0;display:block">Remove journey</button>`}`;
  $('#bk').onclick=()=>{if(id==='quick'&&qTo){qTo=null}home()};
  if($('#save'))$('#save').onclick=()=>$('#star')&&$('#star').click();
  if($('#del'))$('#del').onclick=()=>{const b=$('#del');if(b.dataset.sure){trips=trips.filter(x=>x.id!==id);saveTrips();home()}else{b.dataset.sure=1;b.textContent='Tap again to remove'}};
  removeTrain();drawRoute(r);startArr();
  setBar(`${id==='quick'?'<button class="ghost" id="star" style="flex:0 0 auto;padding:0 20px">☆ Save</button>':''}<button class="primary" id="go">Begin journey</button>`);$('#go').onclick=()=>startRide(t.id);
  if($('#star'))$('#star').onclick=()=>{t.id='t'+Date.now();t.name=`${S[t.from]} → ${S[t.to]}`;saveTrips();const b=$('#star');b.textContent='★ Saved';b.style.color='var(--accent)';b.disabled=true;$('#go').onclick=()=>startRide(t.id);if($('#save'))$('#save').remove()};
  scrollTo({top:0});
}

const g0=r=>r.segs[0].stops[0];
/* ===== Ride mode — counts stops locally, no GPS or signal needed ===== */
let ride=null;
function rideItems(){const out=[];ride.r.segs.forEach((g,K)=>{for(let i=K?1:0;i<=g.n;i++)out.push({seg:K,i,s:g.stops[i]})});return out}
function curItem(){const it=rideItems();let s=ride.seg,i=ride.i;if(i===0&&s>0){s--;i=ride.r.segs[s].n}return it.findIndex(x=>x.seg===s&&x.i===i)}
function setPos(it){ride.seg=it.seg;ride.i=it.i;ride.onTrain=!(it.seg===0&&it.i===0);drawRide()}
let watchId=null;
function startGPS(){try{if(!navigator.geolocation)return;watchId=navigator.geolocation.watchPosition(p=>{if(!ride||p.coords.accuracy>250)return;
  const items=rideItems();let best=-1,bm=1e9;items.forEach((it,k)=>{const m=meters(p.coords.latitude,p.coords.longitude,P[it.s][0],P[it.s][1]);if(m<bm){bm=m;best=k}});
  if(bm<200&&best>curItem()){setPos(items[best]);toast('Located you · '+S[items[best].s])}},()=>{},{enableHighAccuracy:true,maximumAge:15000})}catch(e){}}
function stopGPS(){try{if(watchId!==null)navigator.geolocation.clearWatch(watchId)}catch(e){}watchId=null}
function startRide(id){const t=trips.find(x=>x.id===id);const r=t.opt?t.opt.r:route(t.from,t.to);const sv=store.get('cc_ride_'+id,null);
  ride={id,t,r,seg:sv?sv.seg:0,i:sv?sv.i:0,onTrain:sv?sv.onTrain:false};$('#ride').classList.remove('hidden');setBar('');drawRide(true);startGPS()}
function endRide(){stopGPS();const id=ride.id;store.set('cc_ride_'+id,null);ride=null;$('#ride').classList.add('hidden');try{speechSynthesis.cancel()}catch(e){}removeTrain();showTrip(id)}
function drawRide(first){
  const{r,t}=ride,g=r.segs[ride.seg],L=LINES[g.line],d=L[g.dir];
  store.set('cc_ride_'+ride.id,{seg:ride.seg,i:ride.i,onTrain:ride.onTrain});
  const here=g.stops[Math.min(ride.i,g.n)];placeTrain(here,first);followTrain(here);
  const left=g.n-ride.i,last=ride.seg===r.segs.length-1;
  const done=r.segs.slice(0,ride.seg).reduce((a,x)=>a+x.n,0)+ride.i,pct=done/r.stops;
  const C=2*Math.PI*60;const ringPct=ride.onTrain?(ride.i/g.n):0;
  const ring=num=>`<div class="ring"><svg viewBox="0 0 132 132"><circle class="bg" cx="66" cy="66" r="60"/><circle class="fg" cx="66" cy="66" r="60" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-ringPct)}"/></svg><div class="n">${num}</div></div>`;
  let body,btn,speech='';
  if(!ride.onTrain){
    body=`<div class="rcore">${ring(bullet(g.line).replace('class="bullet"','class="bullet" style="font-size:1.6em"'))}<div><div class="rlabel">${ride.seg?'Change trains':'Board here'}</div>
      <div class="rnext">${ride.seg?'Stay inside the station':esc(S[g.stops[0]])}</div><div class="muted">Front of train reads ${esc(d.last)}</div></div></div>
      ${ride.seg&&g.xferIn.kind==='walk'?`<p class="muted">${esc(g.xferIn.note)}</p>`:''}
      <div class="rlabel" style="margin-top:6px">Follow the sign</div><span class="sign" style="font-size:1.05em;padding:10px 14px">${bullet(g.line)} ${esc(d.sign)}</span>${liveBox(g.stops[0],g.line,g.dir)}`;
    btn=`I'm on the ${g.line} train`;speech=`Follow the sign for the ${g.line}, ${d.sign}.`;
  }else if(left>0){const nxt=S[g.stops[ride.i+1]];
    body=`<div class="rcore">${ring(left)}<div><div class="rlabel">${plural(left,'stop')} to go</div><div class="rnext">${esc(nxt)}</div><div class="muted">Next stop · you leave at ${esc(S[g.stops[g.n]])}</div></div></div>
      ${left===1?`<div class="alertbox"><b>Your stop is next.</b><br><span class="muted">Move toward the doors when the train slows.</span></div>`:''}`;
    btn=`Arrived at ${esc(nxt)}`;if(left===1)speech=`Your stop is next. Get ready to leave at ${nxt}.`;
  }else{
    body=`<div class="rcore">${ring('✓')}<div><div class="rlabel">${last?'You have arrived':'Step off here'}</div><div class="rnext">${esc(S[g.stops[g.n]])}</div>
      <div class="muted">${last?esc(t.note||'Journey complete.'):`Next, change to the ${r.segs[ride.seg+1].line} train.`}</div></div></div>`;
    btn=last?'Finish':'I\'m off the train';speech=last?`You have arrived at ${S[g.stops[g.n]]}.`:`Step off here, at ${S[g.stops[g.n]]}.`;buzz();if(last&&!first)arrive();
  }
  $('#rideView').innerHTML=`<div class="grab"></div>
    <div class="rtop"><span>${esc(t.name)} · ${done} of ${r.stops} stops</span><button class="ghost" id="x">End</button></div>
    <div class="progress" style="--c:${L.c}"><i style="width:${pct*100}%"></i></div>
    <div style="--c:${L.c}">${body}</div><div class="spacer"></div>
    <button class="primary full" id="act">${btn}</button>
    <div class="row2" style="margin-top:10px"><button class="ghost" id="undo">Undo</button><button class="ghost" id="rd">Read aloud</button></div>
    <h2 style="margin-top:26px">Your stations <span class="hint">· lost count? tap the station you see</span></h2>
    <div class="rlist">${(()=>{const items=rideItems(),cur=curItem();return items.map((it,k)=>{const g2=r.segs[it.seg],isEnd=k===items.length-1,isChange=!isEnd&&it.i===g2.n,next=isChange?r.segs[it.seg+1]:null;
      const tag=k===0?'<span class="rt">Start</span>':isChange?`<span class="rt swt">Switch to ${bullet(next.line)}</span>`:isEnd?'<span class="rt ex">Exit</span>':'';
      return `<button class="rs ${k<cur?'past':''} ${k===cur?'cur':''} ${isChange||isEnd||k===0?'key':''}" data-k="${k}"><span class="rr"></span><span class="rd"></span><span class="rn">${esc(S[it.s])}</span>${k===cur?'<span class="here">You\'re here</span>':tag}</button>`}).join('')})()}</div>`;
  $('#x').onclick=endRide;
  document.querySelectorAll('.rs').forEach(b=>b.onclick=()=>{const it=rideItems()[+b.dataset.k];setPos(it);if(it.seg||it.i)say('You are at '+S[it.s])});
  $('#undo').onclick=()=>{if(ride.onTrain&&ride.i>0)ride.i--;else if(ride.onTrain)ride.onTrain=false;else if(ride.seg>0){ride.seg--;ride.i=r.segs[ride.seg].n;ride.onTrain=true}drawRide()};
  $('#rd').onclick=()=>{const s=speakOn;speakOn=true;say(speech||`${plural(left,'stop')} to go. Next stop, ${S[g.stops[ride.i+1]]}.`);speakOn=s};
  $('#act').onclick=()=>{if(!ride.onTrain)ride.onTrain=true;else if(left>0)ride.i++;else if(last){endRide();return}else{ride.seg++;ride.i=0;ride.onTrain=false}drawRide()};
  if(speech&&!first)say(speech);
  if($('#arrBox'))startArr();
}

function toast(m){const d=document.createElement('div');d.className='toast glass';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ===== Weather outside (Open-Meteo, no key). Saved for when you're underground. ===== */
function wxKind(c){if(c==null)return null;if(c>=95)return'storm';if((c>=51&&c<=67)||(c>=80&&c<=82))return'rain';if((c>=71&&c<=77)||c===85||c===86)return'snow';if(c===45||c===48)return'fog';if(c>=2&&c<=3)return'cloud';return'clear'}
const WXL={clear:'Clear',cloud:'Cloudy',fog:'Foggy',rain:'Raining',snow:'Snowing',storm:'Storms'};
function paintWx(w,stale){const k=w&&wxKind(w.code);document.body.dataset.wx=k||'';const c=$('#wx');if(!w){c.classList.add('hidden');return}
  c.classList.remove('hidden');const ago=Math.round((Date.now()-w.t)/60000);
  c.innerHTML=`<i class="wxi ${k}"></i>${w.temp}° · ${WXL[k]} outside${stale&&ago>2?` <span class="muted">· ${ago<60?ago+' min':Math.round(ago/60)+' h'} ago</span>`:''}`}
async function loadWx(){
  const demo=/rain|snow|storm|fog/.exec(location.hash);if(demo){paintWx({t:Date.now(),temp:48,code:{rain:63,snow:73,storm:95,fog:45}[demo[0]]});return}
  const saved=store.get('cc_wx',null);
  if(!isOn()){paintWx(saved,true);return}
  try{const l=lastLoc||DEMO_LOC;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${l.lat.toFixed(3)}&longitude=${l.lng.toFixed(3)}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
    const j=await r.json();const w={t:Date.now(),temp:Math.round(j.current.temperature_2m),code:j.current.weather_code};store.set('cc_wx',w);paintWx(w)}
  catch(e){paintWx(saved,true)}}
/* ===== Boot ===== */
function net(){if($('#arrBox'))refreshArr();const on=isOn();const p=$('#net');p.className='glass eyebrow'+(on?'':' off');p.querySelector('span').textContent=on?'Online':'Offline'}
addEventListener('online',()=>{net();loadWx();toast('Back online · live times refreshed')});addEventListener('offline',loadWx);addEventListener('offline',net);addEventListener('resize',()=>svg&&apply());
if(store.get('cc_big',false))document.body.classList.add('big');
buildMap();
$('#zin').onclick=()=>zoomBy(.7);$('#zout').onclick=()=>zoomBy(1.4);$('#zfit').onclick=()=>{ride&&$('#train')?followTrain($('#train').dataset.s):fitAll()};
net();home();loadWx();setInterval(loadWx,600000);addEventListener('hashchange',loadWx);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.host))navigator.serviceWorker.register('./sw.js')}catch(e){}
</script>
